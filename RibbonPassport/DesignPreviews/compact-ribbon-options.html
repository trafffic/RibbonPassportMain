function tasks(s){if(s.view==='home')return `<div class="cp-section"><h3>Ribbon desk</h3></div><button type="button" class="cp-task cursor-interaction" data-view="add"><span>＋</span><span><strong>Add ribbons</strong><small>Choose a generation and game</small></span></button><button type="button" class="cp-task cursor-interaction" data-view="owned"><span>✓</span><span><strong>Owned ribbons</strong><small>${Object.keys(s.owned).length} recorded · Review / remove</small></span></button><button type="button" class="cp-task cursor-interaction" data-view="transfer"><span>›</span><span><strong>Before transferring</strong><small>Last chance / Available later</small></span></button>`;if(s.view==='add')return `<div class="cp-breadcrumb"><button type="button" class="cursor-interaction" data-home>‹ Ribbon desk</button><span>Add</span></div>${commonAdd(s)}`;if(s.view==='transfer')return `<div class="cp-breadcrumb"><button type="button" class="cursor-interaction" data-home>‹ Ribbon desk</button></div>${transfer(s)}`;
if(s.group)return `<div class="cp-breadcrumb"><button type="button" class="cursor-interaction" data-ungroup>‹ Earning games</button></div>${ownedHeader(s)}${ownedRows(s,5,'groupOwned')}`;
const groups=games.filter(g=>Object.values(s.owned).includes(g.id));return `<div class="cp-breadcrumb"><button type="button" class="cursor-interaction" data-home>‹ Ribbon desk</button></div><div class="cp-section"><h3>Owned · by game</h3><span class="cp-small">${Object.keys(s.owned).length} total</span></div>${slice(s,'groups',groups,5).map(g=>`<button type="button" class="cp-game-group cursor-interaction" data-group="${g.id}">${pic('game-'+g.id)}<span class="cp-group-name"><strong>${g.name}</strong><small>GEN ${roman[g.gen]}</small></span><span>${Object.values(s.owned).filter(v=>v===g.id).length} ›</span></button>`).join('')}${pages(s,'groups',groups.length,5)}`;}
function picker(s){if(s.screen==='generation')return `<div class="cp-breadcrumb"><button type="button" class="cursor-interaction" data-back>‹ Back</button><span>Choose generation</span></div><div class="cp-gen-grid">${Array.from({length:9},(_,i)=>i+1).map(n=>`<button type="button" class="cursor-interaction" data-gen="${n}" aria-pressed="${s.gen===n}">GEN ${roman[n]}<small>${games.filter(g=>g.gen===n&&!g.service).length} games</small></button>`).join('')}</div>`;const n=s.pickerGen||s.gen,list=games.filter(g=>g.gen===n);return `<div class="cp-breadcrumb"><button type="button" class="cursor-interaction" data-generations>‹ Generations</button><span>GEN ${roman[n]}</span></div><div class="cp-section"><h3>Choose game</h3></div><div class="cp-choose-games">${slice(s,'games',list,6).map(g=>`<button type="button" class="cursor-interaction" data-game="${g.id}">${pic('game-'+g.id)}<span>${g.name}<small>${g.compatible?'Compatible':'Cannot enter'}</small></span></button>`).join('')}</div>${pages(s,'games',list.length,6)}`;}
function description(s){const r=R(s.detail),owned=s.owned[r.id],later=future(r,s),why=reason(r,G(s.game),s);const groups=[...new Set(later.map(g=>g.gen))].sort((a,b)=>a-b).map(n=>({title:'GEN '+roman[n],text:later.filter(g=>g.gen===n).map(g=>g.name).join(' · ')}));if(!groups.length)groups.push({title:'Last chance',text:'No valid later opportunity for this Pokémon.'});return `<div class="cp-breadcrumb"><button type="button" class="cursor-interaction" data-back>‹ Back</button><span>Ribbon details</span></div><section class="cp-description"><div class="cp-description-head">${pic(r.id)}<h3>${r.name}</h3></div><div class="cp-subnav"><button type="button" class="cursor-interaction" data-detail-tab="description" aria-pressed="${s.detailTab==='description'}">Description</button><button type="button" class="cursor-interaction" data-detail-tab="availability" aria-pressed="${s.detailTab==='availability'}">Later games</button></div>${s.detailTab==='description'?`<p>${r.desc}</p><div class="cp-record">${owned?'✓ Earned in '+G(owned).name:why||'Not recorded'}</div><div class="cp-small">${status(r,s)}</div>`:`${slice(s,'availability',groups,3).map(g=>`<div class="cp-availability"><strong>${g.title}</strong>${g.text}</div>`).join('')}${pages(s,'availability',groups.length,3)}`}${owned?`<button type="button" class="cp-detail-remove cursor-interaction" data-remove="${r.id}">Remove ribbon</button>`:''}</section>`;}
const names={tabs:'RIBBONS',drawer:'RIBBONS',split:'RIBBON DESK',book:'RIBBON ALBUM',search:'RIBBONS',tasks:'RIBBONS'},renderers={tabs:pocket,drawer,split,book,search,tasks};
function ownedFrom(old){const own={...initial};for(const r of old?.removed||[])delete own[r];for(const[r,g]of Object.entries(old?.added||{}))if(R(r)&&G(g))own[r]=g;return own;}
for(const phone of root.querySelectorAll('[data-design]')){const id=phone.dataset.design,old=saved[id],s={owned:ownedFrom(old),gen:4,game:'platinum',view:['tabs','book','search'].includes(id)?'owned':id==='tasks'?'home':'add',screen:'main',returnScreen:'main',pages:{},category:'all',earnable:true,catalogue:false,query:'',drawer:id==='drawer',detail:null,detailTab:'description',group:null,lastAction:null,message:'',entry:'Edit Pokémon',...old};s.owned=ownedFrom(old);if(!G(s.game)){s.game='platinum';s.gen=4;}if(!['main','generation','games'].includes(s.screen))s.screen='main';models[id]=s;
function render(){const isDetail=s.screen==='detail',body=isDetail?description(s):['generation','games'].includes(s.screen)?picker(s):s.screen==='transfer'?`<div class="cp-breadcrumb"><button type="button" class="cursor-interaction" data-back>‹ Back</button></div>${transfer(s)}`:renderers[id](s);phone.innerHTML=`<div class="cp-status"><span>9:41</span><span>••• ▰</span></div><header class="cp-header"><button type="button" class="cursor-interaction" data-entry>‹ ${s.entry}</button><h2>${names[id]}</h2></header><div class="cp-mon">${pic('metagross','Metagross')}<div><strong>METAGROSS</strong><div class="cp-small">Lv. 100 · Platinum · Colosseum origin</div></div></div><main class="cp-body">${body}</main><footer class="cp-foot"><div class="cp-feedback" aria-live="polite">${s.message||Object.keys(s.owned).length+' owned ribbons · All earning games'}</div><div class="cp-foot-actions"><button type="button" class="cursor-interaction" data-undo ${!s.lastAction?'disabled':''}>Undo</button><button type="button" class="cp-primary cursor-interaction" data-save>Save ribbons</button></div><div class="cp-home"></div></footer>${id==='drawer'&&s.drawer&&s.screen==='main'?drawerLayer(s):''}`;
const searchInput=phone.querySelector('[data-search]');if(searchInput)searchInput.value=s.query;
phone.querySelector('[data-entry]').onclick=()=>{s.entry=s.entry==='Edit Pokémon'?'Stamp album':'Edit Pokémon';render();persist(id);};
phone.querySelector('[data-save]').onclick=()=>{s.message=Object.keys(s.owned).length+' ribbon records saved.';render();persist(id);};
phone.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>{const a=s.lastAction;if(!a)return;if(a.type==='remove')s.owned[a.id]=a.game;else delete s.owned[a.id];s.lastAction=null;s.message='Change undone.';render();persist(id);});
phone.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{s.view=b.dataset.view;s.group=null;s.pages={};s.query='';s.category=s.view==='transfer'?'last':'all';if(id==='tasks'&&s.view==='add'){s.returnScreen='main';s.screen='generation';}render();persist(id);});
phone.querySelectorAll('[data-choose]').forEach(b=>b.onclick=()=>{s.returnScreen=s.screen;s.pickerGen=s.gen;s.screen='generation';s.pages.games=0;render();});
phone.querySelectorAll('[data-gen]').forEach(b=>b.onclick=()=>{s.pickerGen=Number(b.dataset.gen);s.screen='games';s.pages.games=0;render();});phone.querySelector('[data-generations]')?.addEventListener('click',()=>{s.screen='generation';render();});
phone.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{s.game=b.dataset.game;s.gen=G(s.game).gen;s.pages={};s.screen=s.returnScreen||'main';if(s.pending){const r=R(s.pending);s.pending=null;if(!reason(r,G(s.game),s))add(r.id);}render();persist(id);});
phone.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{if(s.screen==='detail'){s.screen=s.detailReturn||'main';s.drawer=s.drawerBeforeDetail||false;}else s.screen=s.returnScreen||'main';s.detail=null;render();});
phone.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{s.pages[b.dataset.page]=(s.pages[b.dataset.page]||0)+Number(b.dataset.step);render();});
phone.querySelector('[data-catalogue]')?.addEventListener('click',()=>{s.catalogue=!s.catalogue;s.pages={};render();});phone.querySelector('[data-filter]')?.addEventListener('change',e=>{s.earnable=e.target.checked;s.pages={};render();persist(id);});phone.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{s.category=b.dataset.category;s.pages={};render();});
phone.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const r=R(b.dataset.add);if(s.owned[r.id])info(r.id);else add(r.id);});
phone.querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>info(b.dataset.info));
phone.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const rid=b.dataset.remove;if(!s.owned[rid])return;s.lastAction={type:'remove',id:rid,game:s.owned[rid]};delete s.owned[rid];s.message=R(rid).name+' removed.';render();persist(id);});
phone.querySelectorAll('[data-drawer]').forEach(b=>b.onclick=()=>{s.drawer=!s.drawer;render();persist(id);});
phone.querySelectorAll('[data-detail-tab]').forEach(b=>b.onclick=()=>{s.detailTab=b.dataset.detailTab;render();});
phone.querySelectorAll('[data-transfer-screen]').forEach(b=>b.onclick=()=>{s.returnScreen='main';s.screen='transfer';s.category='last';render();});
phone.querySelectorAll('[data-transfer-add]').forEach(b=>b.onclick=()=>{const rid=b.dataset.transferAdd;if(!reason(R(rid),G(s.game),s))add(rid);else{s.pending=rid;s.returnScreen=s.screen;s.pickerGen=s.gen;s.screen='games';s.pages.games=0;render();}});
phone.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>{s.view='home';s.screen='main';s.group=null;render();});
phone.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{s.group=b.dataset.group;s.pages.groupOwned=0;render();});phone.querySelector('[data-ungroup]')?.addEventListener('click',()=>{s.group=null;render();});
searchInput?.addEventListener('input',e=>{s.query=e.target.value;s.pages.search=0;render();phone.querySelector('[data-search]').focus();});
}
function add(rid){if(s.owned[rid]||reason(R(rid),G(s.game),s))return;s.owned[rid]=s.game;s.lastAction={type:'add',id:rid,game:s.game};s.message=R(rid).name+' added · '+G(s.game).name;render();persist(id);}
function info(rid){s.detailReturn=s.screen;s.drawerBeforeDetail=s.drawer;s.drawer=false;s.detail=rid;s.detailTab='description';s.pages.availability=0;s.screen='detail';render();}
render();s.render=render;
if(globalThis.Tweak){const options={entry:s.entry};const tweak=new Tweak({container:phone,onChange:()=>{s.entry=options.entry;render();persist(id);}});tweak.addSelect(options,'entry',{label:'Opened from',options:['Edit Pokémon','Stamp album']});}
}
window.addEventListener('openai:set_globals',e=>{const states=e.detail?.globals?.widgetState?.privateContent?.compactRibbonSolutions;if(!states)return;for(const[id,v]of Object.entries(states)){const s=models[id];if(!s)continue;s.owned=ownedFrom(v);s.earnable=v.earnable!==false;if(G(v.game)){s.game=v.game;s.gen=G(v.game).gen;}s.render();}});
})();
</script>
